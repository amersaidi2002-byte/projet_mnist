name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopencv-dev
      - name: Install Python dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Style checks
        run: |
          ruff check training tests scripts
          ruff format --check training tests scripts
      - name: Build and test C++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Python tests and cross-language parity
        run: pytest -q
      - name: Offline training and export smoke check
        run: |
          python -m training.prepare_data
          python -m training.train --model cnn --dataset custom --data data/custom --output runs/smoke --epochs 1
          python -m training.export --model cnn --checkpoint runs/smoke/best.pt --output runs/export
  docker:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        model: [cnn, mlp]
    steps:
      - uses: actions/checkout@v4
      - name: Build and check image entry point
        run: |
          docker build --build-arg MODEL=${{ matrix.model }} -t embedded-digits .
          docker run --rm embedded-digits --help
